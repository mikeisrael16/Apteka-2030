name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: android-apk, cancel-in-progress: true }
env:
  TAG: apk-build
  GH_TOKEN: ${{ github.token }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build
        run: |
          mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
          cd android && (gradle --no-daemon assembleDebug assembleRelease 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]})
      - name: Collect
        if: always()
        run: |
          mkdir -p dist; cp build.log dist/build-log.txt || true
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/ || true
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ || true
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1); cp $BT/lib/apksigner.jar dist/ || true
          $BT/aapt2 dump badging dist/app-release-unsigned.apk > dist/badging.txt || true
          $BT/zipalign -c -v 4 dist/app-release-unsigned.apk | tail -n 2 >> dist/badging.txt || true
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --prerelease -t "APK build files" -n "Automatic build output (unsigned APK, logs, emulator screenshots)."
          for f in $(gh release view $TAG --json assets -q '.assets[].name' | grep '^status-'); do gh release delete-asset $TAG $f -y || true; done
          gh release upload $TAG dist/* --clobber
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: dist/app-debug.apk }
  emulator:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { api: [34, 36] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk }
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: sh android/ci_test.sh out
      - name: Upload result
        if: always()
        run: |
          mkdir -p out; [ -f out/summary.txt ] || echo "RESULT FAIL: emulator did not run" > out/summary.txt
          cd out; for f in *; do mv "$f" "api${{ matrix.api }}_$f"; done
          gh release upload $TAG api${{ matrix.api }}_1_menu.png api${{ matrix.api }}_2_game.png api${{ matrix.api }}_3_back.png api${{ matrix.api }}_summary.txt --clobber || gh release upload $TAG api${{ matrix.api }}_summary.txt --clobber
  done:
    needs: [build, emulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "build=${{ needs.build.result }} emulator=${{ needs.emulator.result }} sha=${{ github.sha }}" > status-${{ github.sha }}.txt
          gh release upload $TAG status-${{ github.sha }}.txt --clobber -R ${{ github.repository }}
